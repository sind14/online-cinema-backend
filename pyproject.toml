[tool.poetry]
name = "online-cinema"
version = "0.1.0"
description = ""
authors = ["Anton <grygorenko23@gmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = ">=0.133.0,<0.134.0"
uvicorn = ">=0.41.0,<0.42.0"
sqlalchemy = ">=2.0.47,<3.0.0"
alembic = ">=1.18.4,<2.0.0"
pydantic = ">=2.12.5,<3.0.0"
pydantic-settings = ">=2.13.1,<3.0.0"
passlib = {extras = ["argon2"], version = ">=1.7.4,<2.0.0"}
python-jose = ">=3.5.0,<4.0.0"
email-validator = ">=2.3.0,<3.0.0"
celery = ">=5.6.2,<6.0.0"
redis = ">=7.2.0,<8.0.0"
google-auth = ">=2.48.0,<3.0.0"
google-auth-oauthlib = ">=1.2.4,<2.0.0"
google-api-python-client = ">=2.190.0,<3.0.0"
python-multipart = "^0.0.22"
psycopg2-binary = "^2.9.11"

[tool.poetry.group.dev.dependencies]
black = ">=26.1.0,<27.0.0"
isort = ">=8.0.0,<9.0.0"
mypy = ">=1.19.1,<2.0.0"
pytest = ">=9.0.2,<10.0.0"
pytest-asyncio = ">=1.3.0,<2.0.0"
httpx = ">=0.28.1,<0.29.0"
celery-types = "^0.24.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
